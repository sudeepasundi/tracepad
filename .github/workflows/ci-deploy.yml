name: CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: engine-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine-rs/Cargo.toml', 'engine-rs/src/**') }}
      - run: npm ci
      - name: Rust unit tests
        run: npm run test:rust
      - name: Unit tests
        run: npm test
      - name: Build PWA and single file
        run: npm run build:all
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests (both builds, iframe, phone)
        run: npm run e2e
      - name: Firefox and WebKit smoke tests
        run: npm run e2e:browsers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
